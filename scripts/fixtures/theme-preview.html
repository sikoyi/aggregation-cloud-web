<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Theme visual check</title></head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp } from 'vue'
      import { createPinia } from 'pinia'
      import { createRouter, createMemoryHistory } from 'vue-router'
      import 'element-plus/theme-chalk/dark/css-vars.css'
      import '/src/styles.css'
      import '/src/theme.css'
      import { initializeTheme } from '/src/composables/useTheme.ts'
      import { useAuthStore } from '/src/stores/auth.ts'
      import AppShell from '/src/layouts/AppShell.vue'
      import Preview from './ThemePreview.vue'
      // Isolated in-memory session: no login or API writes.
      const pinia = createPinia()
      const auth = useAuthStore(pinia)
      auth.token = ''
      auth.user = { username: 'theme-preview', display_name: '主题预览', roles: [], permissions: ['devices.view', 'accounts.view', 'account_warmup.view', 'tasks.view'] }
      const router = createRouter({ history: createMemoryHistory(), routes: [{ path: '/:pathMatch(.*)*', component: Preview }] })
      initializeTheme()
      await router.push('/slots')
      createApp(AppShell).use(pinia).use(router).mount('#app')
    </script>
  </body>
</html>
