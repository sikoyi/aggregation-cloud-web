<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Credential grant synthetic preview</title></head>
<body><div id="app"></div><script type="module">
import { createApp, h, ref } from 'vue'
import { createPinia } from 'pinia'
import '/src/styles.css'
import 'element-plus/es/components/message/style/css'
import 'element-plus/es/components/message-box/style/css'
import View from '/src/views/UserManagementView.vue'
import { useAuthStore } from '/src/stores/auth.ts'

const makeUser = (id, roles, granted = false) => ({ id, username: id, display_name: id,
  is_system_admin: id === 'synthetic-root', status: 'active', version: 1,
  roles, role_ids: roles, role_names: roles, permissions: [], account_credential_reveal_allowed: granted,
  updated_at: '2026-09-14T02:00:00Z', created_at: '2026-09-14T02:00:00Z', last_login_at: null })
let users = [makeUser('synthetic-root', ['super_admin']), makeUser('synthetic-ungranted', ['super_admin']),
  makeUser('synthetic-granted', ['super_admin'], true), makeUser('synthetic-operator', ['operator'])]
const fail = ref(false)
const requestCount = ref(0)
const pinia = createPinia()
const auth = useAuthStore(pinia)
auth.user = users[0]
const originalFetch = window.fetch.bind(window)
const response = (data, status = 200, msg = 'ok') => new Response(JSON.stringify({ code: status === 200 ? 0 : status, msg, data }),
  { status, headers: { 'Content-Type': 'application/json' } })
// No API request or mutation from this fixture reaches an application backend.
window.fetch = async (input, init) => {
  const url = new URL(typeof input === 'string' ? input : input.url, location.href)
  if (!url.pathname.startsWith('/api/')) return originalFetch(input, init)
  if (url.pathname.endsWith('/credential-reveal-grant')) {
    requestCount.value++
    await new Promise(resolve => setTimeout(resolve, 700))
    if (fail.value) return response(null, 409, '数据已变更，请刷新后重试')
    const id = decodeURIComponent(url.pathname.split('/')[3])
    const body = JSON.parse(init.body)
    users = users.map(user => user.id === id ? { ...user, account_credential_reveal_allowed: body.allowed, version: user.version + 1 } : user)
    return response(users.find(user => user.id === id))
  }
  if (url.pathname === '/api/users') return response({ items: users, total: users.length, page: 1, page_size: 20 })
  if (url.pathname === '/api/roles') return response({ items: [], total: 0, page: 1, page_size: 100 })
  return response(null, 403, 'Synthetic fixture does not support this operation')
}
createApp({ setup: () => () => h('main', { style: 'padding:16px' }, [
  h('h1', { style: 'font-size:18px' }, '账号凭据授权 · 合成测试'),
  h('label', ['当前操作者 ', h('select', { onChange: event => { auth.user = users.find(user => user.id === event.target.value) } },
    users.map(user => h('option', { value: user.id }, user.id)))]),
  h('label', { style: 'margin-left:16px' }, [h('input', { type: 'checkbox', onChange: event => { fail.value = event.target.checked } }), '模拟保存失败']),
  h('p', { role: 'status' }, `授权请求 ${requestCount.value} 次`), h(View),
]) }).use(pinia).mount('#app')
</script></body></html>
